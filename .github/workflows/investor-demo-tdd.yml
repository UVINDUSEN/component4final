name: investor-demo-tdd

on:
  push:
    branches:
      - demo/investor-risk-simulation

jobs:
  demo-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: central_backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r central_backend/requirements.txt
      - name: Run investor demo regression
        run: python central_backend/test_investor_demo.py
