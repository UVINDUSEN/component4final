# Repo: UVINDUSEN/component4final
# Save as: .github/workflows/sync-to-central.yml
#
# Mirrors this repository into its own folder inside the central research repo
# and opens (or updates) a pull request there.
#
# Requires repository secret: CENTRAL_REPO_TOKEN
#   A PAT with write access to dulhara79/R26-DS-012
#   (fine-grained: Contents = Read and write, Pull requests = Read and write)

name: Sync to R26-DS-012

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  CENTRAL_REPO: dulhara79/R26-DS-012
  # Destination folder inside the central repo. Only this path is ever touched.
  TARGET_PATH: "Multimodal Risk Fusion and Retrieval-Augmented Clinical Decision Support/c4_final"
  # Stable branch in the central repo, so one PR keeps getting updated
  # instead of a new PR per push.
  SYNC_BRANCH: sync/c4-final
  # "false" = never delete anything in the central repo (add / overwrite only).
  # Set to "true" only if you want the target folder to mirror this repo exactly.
  DELETE_REMOVED: "false"

concurrency:
  group: sync-c4-final
  cancel-in-progress: false

jobs:
  sync:
    # Secrets are not exposed to pull requests coming from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout component4final
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout central repo (main)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CENTRAL_REPO }}
          token: ${{ secrets.CENTRAL_REPO_TOKEN }}
          ref: main
          path: central

      - name: Copy files into the component folder
        run: |
          set -euo pipefail
          mkdir -p "central/${TARGET_PATH}"

          FLAGS=(-a
            --exclude='.git/'
            --exclude='.github/'
            --exclude='node_modules/'
            --exclude='.venv/'
            --exclude='venv/'
            --exclude='__pycache__/'
            --exclude='.ipynb_checkpoints/'
            --exclude='.DS_Store')

          if [ "${DELETE_REMOVED}" = "true" ]; then
            FLAGS+=(--delete)
          fi

          rsync "${FLAGS[@]}" source/ "central/${TARGET_PATH}/"

      - name: Commit to the sync branch
        id: commit
        working-directory: central
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Branch off the latest main every run, so the PR stays mergeable.
          git checkout -B "${SYNC_BRANCH}"

          # Pathspec-scoped staging: nothing outside TARGET_PATH can be
          # added, modified or deleted by this workflow.
          git add -A -- "${TARGET_PATH}"

          if git diff --cached --quiet; then
            echo "No changes to sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "sync(c4_final): ${SOURCE_SHA::7} from ${GITHUB_REPOSITORY}"
            git push --force origin "${SYNC_BRANCH}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the pull request
        if: steps.commit.outputs.changed == 'true'
        working-directory: central
        env:
          GH_TOKEN: ${{ secrets.CENTRAL_REPO_TOKEN }}
          SOURCE_REF: ${{ github.event.pull_request.html_url || github.event.head_commit.url || github.sha }}
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list --repo "${CENTRAL_REPO}" \
            --head "${SYNC_BRANCH}" --base main --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "${EXISTING}" ]; then
            echo "PR #${EXISTING} is already open and has been updated."
          else
            gh pr create --repo "${CENTRAL_REPO}" \
              --base main --head "${SYNC_BRANCH}" \
              --title "Sync component4final into ${TARGET_PATH}" \
              --body "Automated sync from \`${GITHUB_REPOSITORY}\`.

          Only files under \`${TARGET_PATH}\` are changed; every other folder in this repository is untouched.

          Source: ${SOURCE_REF}"
          fi