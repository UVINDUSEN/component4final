name: Notify Main Research Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger component4final synchronization
        env:
          MAIN_REPO_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${MAIN_REPO_TOKEN:-}" ]]; then
            echo "MAIN_REPO_TOKEN is not configured."
            exit 1
          fi

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $MAIN_REPO_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dulhara79/R26-DS-012/dispatches \
            --data '{"event_type":"sync-component4final"}'
