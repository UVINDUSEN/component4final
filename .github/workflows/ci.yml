name: Central Backend CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  care-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MRN_PEPPER: test-only-contract-pepper
      BACKEND_API_TOKEN: test-only-service-token
      CLINICIAN_JWT_SECRET: test-secret-that-is-long-enough-for-tests
      PATIENT_JWT_SECRET: patient-contract-secret-that-is-long-enough-for-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: central_backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r central_backend/requirements.txt
          python -m pip install -r fusion_service/requirements.txt
          python -m pip install pytest
      - name: Compile backend
        run: python -m compileall -q central_backend
      - name: Run clinician, patient, migration and authorization contracts
        working-directory: central_backend
        run: python -m pytest -q tests
      - name: Run backend regression checks
        working-directory: central_backend
        run: python test_backend.py
      - name: Run CARE contract tests
        working-directory: central_backend
        run: python -m unittest test_rag_client_contract.py -v

  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: r26_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d r26_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/r26_test
      MRN_PEPPER: test-only-postgres-pepper
      BACKEND_API_TOKEN: test-only-postgres-service-token
      CLINICIAN_JWT_SECRET: test-postgres-clinician-secret-long-enough
      PATIENT_JWT_SECRET: test-postgres-patient-secret-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: central_backend/requirements.txt
      - name: Install PostgreSQL backup client and backend dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          python -m pip install -r central_backend/requirements.txt
          python -m pip install -r fusion_service/requirements.txt
          python -m pip install pytest
      - name: Run PostgreSQL migration, concurrency and restore gates
        working-directory: central_backend
        run: python -m pytest -q tests/test_postgres_integration.py
